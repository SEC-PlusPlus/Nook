# 应用自定义命令的 ACL:远程页(抖音)经 capability 引用本权限才能 invoke
"$schema" = "../gen/schemas/desktop-schema.json"

[[permission]]
identifier = "allow-app-commands"
description = "DouYinWin 自定义命令白名单"
commands.allow = [
  "toggle_topmost",
  "hide_main",
  "quit_app",
  "show_main_cmd",
  "get_settings",
  "set_opacity",
  "set_hotkey",
  "set_size_preset",
]
